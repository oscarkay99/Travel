name: Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate agent, API, and browser security
        run: |
          node --test api/ai/agent.test.js api/security.test.js
          node --check api/server.js
          sh -n deploy/configure-aop.sh
          sh -n deploy/check-seo.sh
          node --test deploy/seo.test.js
