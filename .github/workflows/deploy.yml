name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RATE_LIMIT_HASH_SECRET: ${{ secrets.RATE_LIMIT_HASH_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          envs: GEMINI_API_KEY_1,GEMINI_API_KEY_2,GEMINI_API_KEY_3,GEMINI_API_KEY_4,GEMINI_API_KEY_5,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,RATE_LIMIT_HASH_SECRET
          script: |
            set -e

            REPO_DIR=/opt/rogernort/repo

            # Clone on first run, pull on subsequent runs
            if [ -d "$REPO_DIR/.git" ]; then
              git -C "$REPO_DIR" fetch origin main
              git -C "$REPO_DIR" reset --hard origin/main
            else
              git clone https://github.com/oscarkay99/Travel.git "$REPO_DIR"
            fi

            # Refuse deployment when the agent or browser scripts fail validation
            docker run --rm -v "$REPO_DIR:/work:ro" -w /work node:24-alpine3.23@sha256:838d276a37a1e42da2a5d01e0ecbb4401ca4147728f62ca2eba6d023a352f88f \
              node --test api/ai/agent.test.js api/security.test.js
            docker run --rm -v "$REPO_DIR:/work:ro" -w /work node:24-alpine3.23@sha256:838d276a37a1e42da2a5d01e0ecbb4401ca4147728f62ca2eba6d023a352f88f \
              node --check api/server.js

            # Deploy static files
            cp "$REPO_DIR/index.html" /opt/rogernort/nginx/html/
            cp "$REPO_DIR/privacy-policy.html" "$REPO_DIR/terms.html" /opt/rogernort/nginx/html/
            cp "$REPO_DIR/robots.txt" "$REPO_DIR/sitemap.xml" /opt/rogernort/nginx/html/
            cp -r "$REPO_DIR/photos/." /opt/rogernort/nginx/html/photos/
            cp "$REPO_DIR"/favicon*.png "$REPO_DIR"/favicon.ico "$REPO_DIR"/apple-touch-icon.png /opt/rogernort/nginx/html/

            # Rebuild API container if sources changed
            cp -r "$REPO_DIR/api/." /opt/rogernort/api/
            mkdir -p /opt/rogernort/api/data
            cp "$REPO_DIR/data/agent-knowledge.json" /opt/rogernort/api/data/agent-knowledge.json

            # Apply every idempotent schema migration before starting the API
            if docker compose -f /opt/rogernort/supabase/docker-compose.yml config --services | grep -qx db; then
              SCHEMA_OWNER=$(docker compose -f /opt/rogernort/supabase/docker-compose.yml exec -T db \
                psql -At -U postgres -d postgres \
                -c "select pg_get_userbyid(nspowner) from pg_namespace where nspname = 'rogernort'" \
                | tr -d '[:space:]')
              if ! echo "$SCHEMA_OWNER" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
                echo "Could not determine a safe owner role for the rogernort schema."
                exit 1
              fi
              DB_PASSWORD=$(grep '^POSTGRES_PASSWORD=' /opt/rogernort/supabase/.env | cut -d= -f2-)
              if [ -z "$DB_PASSWORD" ]; then
                echo "Supabase database password was not found."
                exit 1
              fi
              for MIGRATION in "$REPO_DIR"/supabase/migrations/*.sql; do
                docker compose -f /opt/rogernort/supabase/docker-compose.yml exec -T \
                  -e PGPASSWORD="$DB_PASSWORD" db \
                  psql -v ON_ERROR_STOP=1 -U "$SCHEMA_OWNER" -d postgres \
                  < "$MIGRATION"
              done
            else
              echo "Supabase database service 'db' was not found; refusing an incomplete agent deployment."
              exit 1
            fi

            # Inject Supabase service key from VPS .env into override file (key never touches git)
            SUPA_KEY=$(grep '^SERVICE_ROLE_KEY=' /opt/rogernort/supabase/.env | cut -d= -f2-)
            printf 'services:\n  api:\n    environment:\n      - NODE_ENV=production\n      - SUPA_URL=http://supa-kong:8000\n      - SUPA_SERVICE_KEY=%s\n      - RATE_LIMIT_HASH_SECRET=%s\n      - TURNSTILE_SITE_KEY=%s\n      - TURNSTILE_SECRET_KEY=%s\n      - GEMINI_API_KEY_1=%s\n      - GEMINI_API_KEY_2=%s\n      - GEMINI_API_KEY_3=%s\n      - GEMINI_API_KEY_4=%s\n      - GEMINI_API_KEY_5=%s\n' \
              "$SUPA_KEY" "$RATE_LIMIT_HASH_SECRET" "$TURNSTILE_SITE_KEY" "$TURNSTILE_SECRET_KEY" "$GEMINI_API_KEY_1" "$GEMINI_API_KEY_2" "$GEMINI_API_KEY_3" "$GEMINI_API_KEY_4" "$GEMINI_API_KEY_5" \
              > /opt/rogernort/docker-compose.override.yml
            chmod 600 /opt/rogernort/docker-compose.override.yml

            cd /opt/rogernort
            docker compose build api
            docker compose up -d --no-deps --force-recreate api

            # Install origin-level response headers and validate Nginx before reload.
            NGINX_CONTAINER=""
            EXPECTED_INDEX_SHA=$(sha256sum "$REPO_DIR/index.html" | awk '{print $1}')
            for CONTAINER_ID in $(docker ps --filter status=running --format '{{.ID}} {{.Image}}' \
              | awk 'tolower($2) ~ /nginx/ {print $1}'); do
              ACTUAL_INDEX_SHA=$(docker exec "$CONTAINER_ID" \
                sha256sum /usr/share/nginx/html/index.html 2>/dev/null | awk '{print $1}' || true)
              if [ "$ACTUAL_INDEX_SHA" = "$EXPECTED_INDEX_SHA" ] \
                && docker exec "$CONTAINER_ID" nginx -t >/dev/null 2>&1; then
                NGINX_CONTAINER="$CONTAINER_ID"
                break
              fi
            done
            if [ -z "$NGINX_CONTAINER" ]; then
              echo "Nginx container was not found; refusing deployment without security headers."
              echo "Expected homepage SHA-256: $EXPECTED_INDEX_SHA"
              for CONTAINER_ID in $(docker ps --filter status=running --format '{{.ID}} {{.Image}}' \
                | awk 'tolower($2) ~ /nginx/ {print $1}'); do
                docker inspect --format \
                  'Candidate={{.Name}} image={{.Config.Image}}{{range .Mounts}} mount={{.Source}}:{{.Destination}}{{end}}' \
                  "$CONTAINER_ID"
                docker exec "$CONTAINER_ID" \
                  sha256sum /usr/share/nginx/html/index.html 2>/dev/null || true
              done
              echo "Running container mounts scoped to /opt/rogernort:"
              for CONTAINER_ID in $(docker ps --filter status=running --format '{{.ID}}'); do
                docker inspect --format \
                  'Candidate={{.Name}} image={{.Config.Image}}{{range .Mounts}} mount={{.Source}}:{{.Destination}}{{end}}' \
                  "$CONTAINER_ID"
              done | grep '/opt/rogernort' || true
              if command -v nginx >/dev/null 2>&1; then
                echo "Host Nginx structure:"
                nginx -T 2>&1 \
                  | grep -E '^[[:space:]]*(# configuration file|server_name|root|location|proxy_pass)' \
                  || true
              else
                echo "No host Nginx binary found."
              fi
              exit 1
            fi
            docker cp "$REPO_DIR/deploy/nginx-security-headers.conf" \
              "$NGINX_CONTAINER:/etc/nginx/conf.d/zz-security-headers.conf"
            docker cp "$REPO_DIR/deploy/nginx-security-headers.inc" \
              "$NGINX_CONTAINER:/etc/nginx/security-headers.inc"
            NGINX_CONF_SOURCE=$(docker inspect --format \
              '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d/default.conf"}}{{.Source}}{{end}}{{end}}' \
              "$NGINX_CONTAINER")
            if [ -z "$NGINX_CONF_SOURCE" ]; then
              NGINX_CONF_DIR=$(docker inspect --format \
                '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d"}}{{.Source}}{{end}}{{end}}' \
                "$NGINX_CONTAINER")
              NGINX_CONF_SOURCE="$NGINX_CONF_DIR/default.conf"
            fi
            case "$NGINX_CONF_SOURCE" in
              /opt/rogernort/*) ;;
              /opt/kindnesshcs/nginx.conf)
                # This legacy-named mount was verified to be the single-server
                # config whose document root contains the exact deployed page.
                if [ "$(grep -Ec '^[[:space:]]*server[[:space:]]*\{' "$NGINX_CONF_SOURCE")" -ne 1 ] \
                  || ! grep -Eq '^[[:space:]]*root[[:space:]]+/usr/share/nginx/html;' "$NGINX_CONF_SOURCE"; then
                  echo "Legacy Nginx mount no longer has the verified Rogernort structure."
                  exit 1
                fi
                ;;
              *) echo "Refusing to edit unexpected Nginx path: $NGINX_CONF_SOURCE"; exit 1 ;;
            esac
            if [ ! -f "$NGINX_CONF_SOURCE" ]; then
              echo "Static-site Nginx configuration was not found."
              exit 1
            fi
            if ! grep -q "BEGIN ROGERNORT MANAGED SECURITY HEADERS" "$NGINX_CONF_SOURCE"; then
              cp "$NGINX_CONF_SOURCE" "$NGINX_CONF_SOURCE.pre-rogernort-security"
              sed -e '/include \/etc\/nginx\/security-headers\.inc;/d' \
                -e "/^[[:space:]]*location[[:space:]].*{[[:space:]]*$/r $REPO_DIR/deploy/nginx-security-headers.inc" \
                "$NGINX_CONF_SOURCE" > /tmp/rogernort-nginx.conf
              cat /tmp/rogernort-nginx.conf > "$NGINX_CONF_SOURCE"
              rm /tmp/rogernort-nginx.conf
            fi
            docker exec "$NGINX_CONTAINER" nginx -t
            docker exec "$NGINX_CONTAINER" nginx -s reload

            # Confirm the API is healthy and one grounded non-sensitive
            # conversation completes through the production route.
            for ATTEMPT in 1 2 3 4 5 6; do
              STATUS_JSON=$(curl -fsS https://rogernortconsult.com/api/agent/status || true)
              if echo "$STATUS_JSON" | grep -q '"ok":true'; then
                break
              fi
              sleep 5
            done
            echo "$STATUS_JSON" | grep -q '"ok":true'

            CHAT_JSON=$(curl -fsS -X POST https://rogernortconsult.com/api/agent/chat \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://rogernortconsult.com' \
              --data '{"message":"Where is your office and when are you open?"}')
            echo "$CHAT_JSON" | grep -q '"ok":true'

            curl -fsSI https://rogernortconsult.com/ | grep -qi '^content-security-policy:'
            curl -fsSI https://rogernortconsult.com/ | grep -qi '^strict-transport-security:'

            echo "✓ Deployed at $(date)"

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            -o /dev/null -w "Cloudflare purge status: %{http_code}\n" \
            --fail-with-body
