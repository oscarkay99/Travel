name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RATE_LIMIT_HASH_SECRET: ${{ secrets.RATE_LIMIT_HASH_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          envs: GEMINI_API_KEY_1,GEMINI_API_KEY_2,GEMINI_API_KEY_3,GEMINI_API_KEY_4,GEMINI_API_KEY_5,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY,RATE_LIMIT_HASH_SECRET
          script: |
            set -e

            REPO_DIR=/opt/rogernort/repo

            # Clone on first run, pull on subsequent runs
            if [ -d "$REPO_DIR/.git" ]; then
              git -C "$REPO_DIR" fetch origin main
              git -C "$REPO_DIR" reset --hard origin/main
            else
              git clone https://github.com/oscarkay99/Travel.git "$REPO_DIR"
            fi

            # Refuse deployment when the agent or browser scripts fail validation
            docker run --rm -v "$REPO_DIR:/work:ro" -w /work node:24-alpine3.23@sha256:838d276a37a1e42da2a5d01e0ecbb4401ca4147728f62ca2eba6d023a352f88f \
              node --test api/ai/agent.test.js api/security.test.js
            docker run --rm -v "$REPO_DIR:/work:ro" -w /work node:24-alpine3.23@sha256:838d276a37a1e42da2a5d01e0ecbb4401ca4147728f62ca2eba6d023a352f88f \
              node --check api/server.js

            # Deploy static files
            cp "$REPO_DIR/index.html" /opt/rogernort/nginx/html/
            cp "$REPO_DIR/privacy-policy.html" "$REPO_DIR/terms.html" /opt/rogernort/nginx/html/
            cp "$REPO_DIR/robots.txt" "$REPO_DIR/sitemap.xml" /opt/rogernort/nginx/html/
            cp -r "$REPO_DIR/photos/." /opt/rogernort/nginx/html/photos/
            cp "$REPO_DIR"/favicon*.png "$REPO_DIR"/favicon.ico "$REPO_DIR"/apple-touch-icon.png /opt/rogernort/nginx/html/

            # Rebuild API container if sources changed
            cp -r "$REPO_DIR/api/." /opt/rogernort/api/
            mkdir -p /opt/rogernort/api/data
            cp "$REPO_DIR/data/agent-knowledge.json" /opt/rogernort/api/data/agent-knowledge.json

            # Apply every idempotent schema migration before starting the API
            if docker compose -f /opt/rogernort/supabase/docker-compose.yml config --services | grep -qx db; then
              SCHEMA_OWNER=$(docker compose -f /opt/rogernort/supabase/docker-compose.yml exec -T db \
                psql -At -U postgres -d postgres \
                -c "select pg_get_userbyid(nspowner) from pg_namespace where nspname = 'rogernort'" \
                | tr -d '[:space:]')
              if ! echo "$SCHEMA_OWNER" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
                echo "Could not determine a safe owner role for the rogernort schema."
                exit 1
              fi
              DB_PASSWORD=$(grep '^POSTGRES_PASSWORD=' /opt/rogernort/supabase/.env | cut -d= -f2-)
              if [ -z "$DB_PASSWORD" ]; then
                echo "Supabase database password was not found."
                exit 1
              fi
              for MIGRATION in "$REPO_DIR"/supabase/migrations/*.sql; do
                docker compose -f /opt/rogernort/supabase/docker-compose.yml exec -T \
                  -e PGPASSWORD="$DB_PASSWORD" db \
                  psql -v ON_ERROR_STOP=1 -U "$SCHEMA_OWNER" -d postgres \
                  < "$MIGRATION"
              done
            else
              echo "Supabase database service 'db' was not found; refusing an incomplete agent deployment."
              exit 1
            fi

            # Inject Supabase service key from VPS .env into override file (key never touches git)
            SUPA_KEY=$(grep '^SERVICE_ROLE_KEY=' /opt/rogernort/supabase/.env | cut -d= -f2-)
            printf 'services:\n  api:\n    environment:\n      - NODE_ENV=production\n      - SUPA_URL=http://supa-kong:8000\n      - SUPA_SERVICE_KEY=%s\n      - RATE_LIMIT_HASH_SECRET=%s\n      - TURNSTILE_SITE_KEY=%s\n      - TURNSTILE_SECRET_KEY=%s\n      - GEMINI_API_KEY_1=%s\n      - GEMINI_API_KEY_2=%s\n      - GEMINI_API_KEY_3=%s\n      - GEMINI_API_KEY_4=%s\n      - GEMINI_API_KEY_5=%s\n' \
              "$SUPA_KEY" "$RATE_LIMIT_HASH_SECRET" "$TURNSTILE_SITE_KEY" "$TURNSTILE_SECRET_KEY" "$GEMINI_API_KEY_1" "$GEMINI_API_KEY_2" "$GEMINI_API_KEY_3" "$GEMINI_API_KEY_4" "$GEMINI_API_KEY_5" \
              > /opt/rogernort/docker-compose.override.yml
            chmod 600 /opt/rogernort/docker-compose.override.yml

            cd /opt/rogernort
            docker compose build api
            docker compose up -d --no-deps --force-recreate api

            # Harden only the dedicated Rogernort host-level Nginx site.
            NGINX_CONF=/etc/nginx/sites-enabled/rogernort-www
            if [ ! -f "$NGINX_CONF" ] \
              || ! grep -Eq 'server_name[[:space:]]+rogernortconsult\.com' "$NGINX_CONF" \
              || ! grep -Eq 'root[[:space:]]+/opt/rogernort/nginx/html;' "$NGINX_CONF" \
              || grep -Eq 'server_name[^;]*(ffbeauty|kingdomhcs|wirelesscares)' "$NGINX_CONF"; then
              echo "Dedicated Rogernort Nginx configuration failed its safety checks."
              exit 1
            fi
            NGINX_BACKUP=/etc/nginx/sites-enabled/rogernort-www.pre-security
            cp "$NGINX_CONF" "$NGINX_BACKUP"
            awk -v snippet="$REPO_DIR/deploy/nginx-security-headers.inc" '
              /# BEGIN ROGERNORT MANAGED SECURITY HEADERS/ { skip_headers = 1 }
              skip_headers && /# END ROGERNORT MANAGED SECURITY HEADERS/ { skip_headers = 0; next }
              skip_headers { next }
              /# BEGIN ROGERNORT MANAGED API LIMITS/ { skip_api = 1 }
              skip_api && /# END ROGERNORT MANAGED API LIMITS/ { skip_api = 0; next }
              skip_api { next }
              {
                print
                if ($0 ~ /^[[:space:]]*location[[:space:]].*\{[[:space:]]*$/) {
                  if ($0 ~ /\/api\//) {
                    print "        # BEGIN ROGERNORT MANAGED API LIMITS"
                    print "        client_max_body_size 16k;"
                    print "        client_body_timeout 10s;"
                    print "        # END ROGERNORT MANAGED API LIMITS"
                  } else if ($0 !~ /\.well-known/) {
                    while ((getline header < snippet) > 0) print header
                    close(snippet)
                  }
                }
              }
            ' "$NGINX_CONF" > /tmp/rogernort-nginx.conf
            cat /tmp/rogernort-nginx.conf > "$NGINX_CONF"
            rm /tmp/rogernort-nginx.conf
            if ! nginx -t; then
              cat "$NGINX_BACKUP" > "$NGINX_CONF"
              nginx -t
              echo "Nginx hardening failed validation and was rolled back."
              exit 1
            fi
            systemctl reload nginx

            # Confirm the API is healthy and one grounded non-sensitive
            # conversation completes through the production route.
            for ATTEMPT in 1 2 3 4 5 6; do
              STATUS_JSON=$(curl -fsS https://rogernortconsult.com/api/agent/status || true)
              if echo "$STATUS_JSON" | grep -q '"ok":true'; then
                break
              fi
              sleep 5
            done
            echo "$STATUS_JSON" | grep -q '"ok":true'

            if ! CONTENT_JSON=$(curl -fsS https://rogernortconsult.com/api/content); then
              echo "Public content smoke test failed; safe schema diagnostics follow:"
              docker inspect --format \
                '{{.Name}} networks={{range $name, $network := .NetworkSettings.Networks}}{{$name}} {{end}}' \
                rogernort-api rogernort-kong
              docker exec rogernort-api node -e \
                "const url=process.env.SUPA_URL+'/rest/v1/destinations?select=id&limit=0'; fetch(url,{headers:{apikey:process.env.SUPA_SERVICE_KEY,Authorization:'Bearer '+process.env.SUPA_SERVICE_KEY,'Accept-Profile':'rogernort'}}).then(r=>console.log('In-container PostgREST HTTP='+r.status)).catch(e=>console.log('In-container PostgREST error='+(e.cause?.code||e.code||'request_failed')))"
              for CONTENT_ROUTE in \
                'destinations?select=name,region,image_url,price_from,badge&active=eq.true&order=sort_order.asc&limit=0' \
                'testimonials?select=name,destination,rating,content&active=eq.true&order=sort_order.asc&limit=0'; do
                curl -sS --max-time 10 -w '\nPostgREST HTTP=%{http_code}\n' \
                  "http://127.0.0.1:8010/rest/v1/$CONTENT_ROUTE" \
                  -H "apikey: $SUPA_KEY" \
                  -H "Authorization: Bearer $SUPA_KEY" \
                  -H 'Accept-Profile: rogernort' \
                  -H 'Accept: application/json'
              done
              docker compose -f /opt/rogernort/supabase/docker-compose.yml exec -T \
                -e PGPASSWORD="$DB_PASSWORD" db \
                psql -At -U "$SCHEMA_OWNER" -d postgres -c \
                "select table_schema || '.' || table_name || ':' || string_agg(column_name, ',' order by ordinal_position) from information_schema.columns where table_schema = 'rogernort' and table_name in ('destinations', 'testimonials') group by table_schema, table_name order by table_name;"
              docker compose -f /opt/rogernort/supabase/docker-compose.yml exec -T \
                -e PGPASSWORD="$DB_PASSWORD" db \
                psql -At -U "$SCHEMA_OWNER" -d postgres -c \
                "select table_name || ':service_role_select=' || has_table_privilege('service_role', quote_ident(table_schema) || '.' || quote_ident(table_name), 'select') from information_schema.tables where table_schema = 'rogernort' and table_name in ('destinations', 'testimonials') order by table_name;"
              exit 1
            fi
            echo "$CONTENT_JSON" | grep -q '"ok":true'

            CHAT_JSON=$(curl -fsS -X POST https://rogernortconsult.com/api/agent/chat \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://rogernortconsult.com' \
              --data '{"message":"Where is your office and when are you open?"}')
            echo "$CHAT_JSON" | grep -q '"ok":true'

            curl -fsSI https://rogernortconsult.com/ | grep -qi '^content-security-policy:'
            curl -fsSI https://rogernortconsult.com/ | grep -qi '^strict-transport-security:'

            echo "✓ Deployed at $(date)"

      - name: Purge Cloudflare cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            -o /dev/null -w "Cloudflare purge status: %{http_code}\n" \
            --fail-with-body
